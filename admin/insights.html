<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Insights — Say More Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="admin__sidebar" id="adminSidebar">
      <div class="admin__brand">
        <img src="/logo.jpg" alt="" />
        <strong>Say More Admin</strong>
      </div>
      <nav class="admin__nav">
        <a href="/admin/index">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/admin/leads">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </a>
        <a href="/admin/website">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Website
        </a>
        <a href="/admin/blog">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Blog
        </a>
        <a href="/admin/insights">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Insights
        </a>
      </nav>
      <div class="admin__sidebar-foot">
        <a href="/" target="_blank" rel="noopener">View website ↗</a>
        <button id="adminLogoutBtn" type="button">Sign out</button>
      </div>
    </aside>
    <button class="admin__menu-toggle" id="adminMenuToggle" aria-label="Toggle menu">☰ Menu</button>

    <main class="admin__main insights-main">
      <div id="alert"></div>

      <!-- Header row: domain + online + filters -->
      <div class="insights-header">
        <div class="insights-header__left">
          <span class="insights-header__domain">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>www.saymorepsychotherapy.ca</span>
          </span>
          <span class="insights-header__online">
            <span class="online-dot" id="onlineDot"></span>
            <span id="onlineCount">0</span> online
          </span>
        </div>
        <div class="insights-header__right">
          <div class="range-picker" id="rangePicker">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <select id="rangeSelect">
              <option value="1">Last 24 Hours</option>
              <option value="7" selected>Last 7 Days</option>
              <option value="30">Last 30 Days</option>
              <option value="90">Last 90 Days</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Stat tiles + chart -->
      <div class="insights-card">
        <div class="stat-tiles" id="statTiles">
          <button type="button" class="stat-tile is-active" data-metric="visitors">
            <div class="stat-tile__label">Visitors</div>
            <div class="stat-tile__row">
              <div class="stat-tile__value" id="statVisitors">—</div>
              <div class="stat-tile__delta" id="statVisitorsDelta"></div>
            </div>
          </button>
          <button type="button" class="stat-tile" data-metric="pageviews">
            <div class="stat-tile__label">Page Views</div>
            <div class="stat-tile__row">
              <div class="stat-tile__value" id="statPageviews">—</div>
              <div class="stat-tile__delta" id="statPageviewsDelta"></div>
            </div>
          </button>
          <button type="button" class="stat-tile" data-metric="bounce">
            <div class="stat-tile__label">Bounce Rate</div>
            <div class="stat-tile__row">
              <div class="stat-tile__value" id="statBounce">—</div>
              <div class="stat-tile__delta" id="statBounceDelta"></div>
            </div>
          </button>
        </div>

        <div class="chart-wrap">
          <svg id="chart" class="chart" viewBox="0 0 900 280" preserveAspectRatio="none" aria-hidden="true">
            <!-- rendered by JS -->
          </svg>
          <div class="chart-xlabels" id="chartXLabels"></div>
        </div>
      </div>

      <!-- Pages + Referrers row -->
      <div class="insights-grid insights-grid--2">
        <div class="insights-card">
          <div class="insights-panel-head">
            <div class="insights-panel-tabs">
              <button type="button" class="is-active">Pages</button>
            </div>
            <div class="insights-panel-count">VISITORS</div>
          </div>
          <div id="pagesList" class="ins-list"><div class="loading">Loading…</div></div>
        </div>
        <div class="insights-card">
          <div class="insights-panel-head">
            <div class="insights-panel-tabs">
              <button type="button" class="is-active">Referrers</button>
            </div>
            <div class="insights-panel-count">VISITORS</div>
          </div>
          <div id="referrersList" class="ins-list"><div class="loading">Loading…</div></div>
        </div>
      </div>

      <!-- Countries / Devices / Operating Systems row -->
      <div class="insights-grid insights-grid--3">
        <div class="insights-card">
          <div class="insights-panel-head">
            <div class="insights-panel-tabs">
              <button type="button" class="is-active">Countries</button>
            </div>
            <div class="insights-panel-count">VISITORS</div>
          </div>
          <div id="countriesList" class="ins-list"><div class="loading">Loading…</div></div>
        </div>
        <div class="insights-card">
          <div class="insights-panel-head">
            <div class="insights-panel-tabs">
              <button type="button" class="is-active" data-tab="devices">Devices</button>
              <button type="button" data-tab="browsers">Browsers</button>
            </div>
            <div class="insights-panel-count">VISITORS</div>
          </div>
          <div id="devicesList" class="ins-list"><div class="loading">Loading…</div></div>
          <div id="browsersList" class="ins-list hidden"></div>
        </div>
        <div class="insights-card">
          <div class="insights-panel-head">
            <div class="insights-panel-tabs">
              <button type="button" class="is-active">Operating Systems</button>
            </div>
            <div class="insights-panel-count">VISITORS</div>
          </div>
          <div id="osList" class="ins-list"><div class="loading">Loading…</div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
  //------------------------------------------------------------
  // Icons for referrers + country names
  //------------------------------------------------------------
  const REFERRER_ICONS = {
    "google.com":   `<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18c-.44-1.32-.69-2.73-.69-4.18s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>`,
    "instagram.com": `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="_igg" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F58529"/><stop offset="35%" stop-color="#DD2A7B"/><stop offset="65%" stop-color="#8134AF"/><stop offset="100%" stop-color="#515BD4"/></linearGradient></defs><path fill="url(#_igg)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>`,
    "facebook.com":  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`,
    "linkedin.com":  `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0A66C2" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`,
    "twitter.com":   `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000000" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
    "x.com":         `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000000" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
    "reddit.com":    `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF4500" d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-6.988 4.87-3.86 0-6.989-2.176-6.989-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/></svg>`,
    "youtube.com":   `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`,
    "bing.com":      `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#008373" d="M17.5 15.5L11 12l-.5-8H5v16.5l5.5 3.5L21 17V9.5z"/></svg>`,
    "duckduckgo.com":`<svg viewBox="0 0 24 24" aria-hidden="true"><circle fill="#DE5833" cx="12" cy="12" r="12"/><path fill="#FFFFFF" d="M12 6c-3 0-5 2-5 5s2 5 5 5 5-2 5-5-2-5-5-5z"/></svg>`,
    "generic":       `<svg viewBox="0 0 24 24" fill="none" stroke="#8C7B6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
    "direct":        `<svg viewBox="0 0 24 24" fill="none" stroke="#8C7B6C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  };

  function iconForReferrer(host) {
    if (!host) return REFERRER_ICONS.direct;
    const h = host.toLowerCase().replace(/^www\./, "");
    // Direct match
    if (REFERRER_ICONS[h]) return REFERRER_ICONS[h];
    // Country-scoped Google / Bing / etc. — strip TLD
    if (h.startsWith("google.") || h.includes(".google.")) return REFERRER_ICONS["google.com"];
    if (h.endsWith(".facebook.com") || h === "l.facebook.com" || h === "m.facebook.com") return REFERRER_ICONS["facebook.com"];
    if (h.endsWith(".instagram.com") || h === "l.instagram.com") return REFERRER_ICONS["instagram.com"];
    if (h.endsWith(".linkedin.com") || h === "lnkd.in") return REFERRER_ICONS["linkedin.com"];
    if (h === "t.co" || h.endsWith(".twitter.com")) return REFERRER_ICONS["twitter.com"];
    if (h.endsWith(".reddit.com")) return REFERRER_ICONS["reddit.com"];
    if (h === "youtu.be" || h.endsWith(".youtube.com")) return REFERRER_ICONS["youtube.com"];
    if (h.startsWith("bing.")) return REFERRER_ICONS["bing.com"];
    if (h.startsWith("duckduckgo.")) return REFERRER_ICONS["duckduckgo.com"];
    return REFERRER_ICONS.generic;
  }

  // ISO 3166-1 alpha-2 → country name (partial; falls back to code)
  const COUNTRY_NAMES = {
    CA: "Canada", US: "United States of America", GB: "United Kingdom",
    FR: "France", DE: "Germany", IT: "Italy", ES: "Spain", PT: "Portugal",
    NL: "Netherlands", BE: "Belgium", CH: "Switzerland", AT: "Austria",
    SE: "Sweden", NO: "Norway", DK: "Denmark", FI: "Finland", IE: "Ireland",
    PL: "Poland", CZ: "Czechia", HU: "Hungary", GR: "Greece", RO: "Romania",
    RU: "Russia", UA: "Ukraine", TR: "Turkey", IL: "Israel", AE: "UAE",
    SA: "Saudi Arabia", EG: "Egypt", ZA: "South Africa", NG: "Nigeria",
    KE: "Kenya", MA: "Morocco", GH: "Ghana", IN: "India", PK: "Pakistan",
    BD: "Bangladesh", LK: "Sri Lanka", NP: "Nepal", CN: "China", JP: "Japan",
    KR: "South Korea", HK: "Hong Kong", TW: "Taiwan", SG: "Singapore",
    MY: "Malaysia", TH: "Thailand", VN: "Vietnam", ID: "Indonesia",
    PH: "Philippines", AU: "Australia", NZ: "New Zealand",
    MX: "Mexico", BR: "Brazil", AR: "Argentina", CL: "Chile", CO: "Colombia",
    PE: "Peru", VE: "Venezuela", EC: "Ecuador",
  };
  function countryName(iso) {
    if (!iso) return "Unknown";
    return COUNTRY_NAMES[String(iso).toUpperCase()] || iso;
  }
  function countryFlag(iso) {
    if (!iso || iso.length !== 2) {
      return `<span class="flag-fallback" aria-hidden="true">🏳️</span>`;
    }
    const lower = String(iso).toLowerCase();
    // flagcdn.com serves free SVG country flags at a stable URL by ISO code.
    return `<img class="flag-img" src="https://flagcdn.com/w40/${lower}.png" srcset="https://flagcdn.com/w80/${lower}.png 2x" width="22" height="16" alt="${escapeHtml(iso)}" loading="lazy" />`;
  }

  //------------------------------------------------------------
  // State
  //------------------------------------------------------------
  const state = {
    data: null,
    metric: "visitors",  // which stat tile is active for the chart
    days: 7,
  };

  //------------------------------------------------------------
  // Rendering helpers
  //------------------------------------------------------------
  function fmtDelta(pct, kind) {
    // kind: "gain" (higher is better, e.g. visitors) or "loss" (higher is worse, e.g. bounce)
    if (pct === 0 || pct == null) return `<span class="delta">±0%</span>`;
    const positive = pct > 0;
    const good = (kind === "loss") ? !positive : positive;
    const cls = good ? "delta delta--good" : "delta delta--bad";
    const sign = positive ? "+" : "";
    return `<span class="${cls}">${sign}${pct}%</span>`;
  }
  function fmtDeltaPP(pp) {
    if (pp === 0 || pp == null) return `<span class="delta">±0%</span>`;
    const positive = pp > 0;
    // For bounce rate, an increase is BAD
    const cls = positive ? "delta delta--bad" : "delta delta--good";
    const sign = positive ? "+" : "";
    return `<span class="${cls}">${sign}${pp}%</span>`;
  }

  function renderStats(d) {
    document.getElementById("statVisitors").textContent = d.totals.visitors;
    document.getElementById("statVisitorsDelta").innerHTML = fmtDelta(d.totals.visitors_delta_pct, "gain");
    document.getElementById("statPageviews").textContent = d.totals.pageviews;
    document.getElementById("statPageviewsDelta").innerHTML = fmtDelta(d.totals.pageviews_delta_pct, "gain");
    document.getElementById("statBounce").textContent = d.totals.bounce_rate + "%";
    document.getElementById("statBounceDelta").innerHTML = fmtDeltaPP(d.totals.bounce_rate_delta_pp);
    document.getElementById("onlineCount").textContent = d.online || 0;
    document.getElementById("onlineDot").classList.toggle("is-live", (d.online || 0) > 0);
  }

  function renderChart(d) {
    const svg = document.getElementById("chart");
    const labelsEl = document.getElementById("chartXLabels");
    // Build a padded series covering every day in the range even if 0
    const days = state.days;
    const now = new Date();
    const start = new Date(now.getTime() - (days - 1) * 24 * 60 * 60 * 1000);
    start.setUTCHours(0, 0, 0, 0);
    const seriesMap = new Map();
    (d.timeseries || []).forEach(r => {
      const key = new Date(r.day).toISOString().slice(0, 10);
      seriesMap.set(key, r);
    });
    const series = [];
    for (let i = 0; i < days; i++) {
      const dt = new Date(start.getTime() + i * 24 * 60 * 60 * 1000);
      const key = dt.toISOString().slice(0, 10);
      const row = seriesMap.get(key);
      const val = state.metric === "pageviews" ? (row ? row.pageviews : 0)
                : state.metric === "bounce"    ? 0  // per-day bounce isn't in payload; leave flat
                :                                 (row ? row.visitors : 0);
      series.push({ date: dt, value: val });
    }

    const W = 900, H = 280, padL = 40, padR = 12, padT = 20, padB = 32;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;

    const maxVal = Math.max(1, ...series.map(s => s.value));
    // Nicer scale — round max up to next multiple of 5 (or 1 if very small)
    const step = maxVal <= 5 ? 1 : maxVal <= 20 ? 5 : maxVal <= 100 ? 10 : 25;
    const scaleMax = Math.ceil(maxVal / step) * step;

    const xAt = (i) => padL + (series.length <= 1 ? 0 : (i / (series.length - 1)) * chartW);
    const yAt = (v) => padT + chartH - (scaleMax === 0 ? 0 : (v / scaleMax) * chartH);

    const linePath = series.map((s, i) => (i === 0 ? "M" : "L") + xAt(i) + "," + yAt(s.value)).join(" ");
    const areaPath = linePath + " L" + xAt(series.length - 1) + "," + (padT + chartH) + " L" + xAt(0) + "," + (padT + chartH) + " Z";

    // Y-axis gridlines + labels
    let gridSvg = "";
    for (let t = 0; t <= 3; t++) {
      const val = Math.round((scaleMax * t) / 3);
      const y = yAt(val);
      gridSvg += `
        <line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="#EAE6DD" stroke-width="1"/>
        <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8C7B6C" font-family="Manrope, sans-serif">${val}</text>
      `;
    }

    svg.innerHTML = `
      <defs>
        <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${gridSvg}
      <path d="${areaPath}" fill="url(#chartFill)" />
      <path d="${linePath}" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${series.map((s, i) => `<circle cx="${xAt(i)}" cy="${yAt(s.value)}" r="3" fill="#2563EB"/>`).join("")}
    `;

    // X labels (space them so they don't overlap)
    const labelStep = series.length <= 7 ? 1 : series.length <= 14 ? 2 : Math.ceil(series.length / 7);
    labelsEl.innerHTML = series.map((s, i) => {
      if (i % labelStep !== 0 && i !== series.length - 1) return "";
      const label = s.date.toLocaleDateString("en-CA", { month: "short", day: "numeric" });
      return `<span>${label}</span>`;
    }).join("");
  }

  function renderList(el, rows, extractor) {
    if (!rows || !rows.length) {
      el.innerHTML = `<div class="ins-empty">No data yet in this range.</div>`;
      return;
    }
    const total = rows.reduce((s, r) => s + (r.visitors || 0), 0) || 1;
    el.innerHTML = rows.map(r => {
      const { key, label, icon } = extractor(r);
      const pct = Math.round((r.visitors / total) * 100);
      const barWidth = Math.max(2, pct);
      return `
        <div class="ins-row">
          <div class="ins-row__bar" style="width: ${barWidth}%"></div>
          <div class="ins-row__label">
            ${icon || ""}
            <span title="${escapeHtml(label)}">${escapeHtml(label)}</span>
          </div>
          <div class="ins-row__value">${r.visitors}</div>
        </div>
      `;
    }).join("");
  }

  function renderAll(d) {
    state.data = d;
    renderStats(d);
    renderChart(d);

    renderList(document.getElementById("pagesList"), d.pages, r => ({
      key: r.path, label: r.path || "/", icon: "",
    }));

    renderList(document.getElementById("referrersList"), d.referrers, r => {
      const host = r.host || "direct";
      return { key: host, label: host, icon: `<span class="ins-row__icon">${iconForReferrer(host)}</span>` };
    });

    // Countries — show as "% of total" the way Vercel does
    const countriesEl = document.getElementById("countriesList");
    const countriesTotal = (d.countries || []).reduce((s, r) => s + r.visitors, 0) || 1;
    if (!d.countries || !d.countries.length) {
      countriesEl.innerHTML = `<div class="ins-empty">No data yet in this range.</div>`;
    } else {
      countriesEl.innerHTML = d.countries.map(r => {
        const pct = Math.round((r.visitors / countriesTotal) * 100);
        const barWidth = Math.max(2, pct);
        return `
          <div class="ins-row">
            <div class="ins-row__bar" style="width: ${barWidth}%"></div>
            <div class="ins-row__label">
              <span class="ins-row__flag" aria-hidden="true">${countryFlag(r.country)}</span>
              <span>${escapeHtml(countryName(r.country))}</span>
            </div>
            <div class="ins-row__value">${pct}%</div>
          </div>
        `;
      }).join("");
    }

    // Devices + Browsers (percentages)
    const devicesEl = document.getElementById("devicesList");
    const devTotal = (d.devices || []).reduce((s, r) => s + r.visitors, 0) || 1;
    devicesEl.innerHTML = (d.devices || []).map(r => {
      const pct = Math.round((r.visitors / devTotal) * 100);
      return `
        <div class="ins-row">
          <div class="ins-row__bar" style="width: ${Math.max(2, pct)}%"></div>
          <div class="ins-row__label"><span>${escapeHtml(r.type || "Unknown")}</span></div>
          <div class="ins-row__value">${pct}%</div>
        </div>
      `;
    }).join("") || `<div class="ins-empty">No data yet.</div>`;

    const browsersEl = document.getElementById("browsersList");
    const brTotal = (d.browsers || []).reduce((s, r) => s + r.visitors, 0) || 1;
    browsersEl.innerHTML = (d.browsers || []).map(r => {
      const pct = Math.round((r.visitors / brTotal) * 100);
      return `
        <div class="ins-row">
          <div class="ins-row__bar" style="width: ${Math.max(2, pct)}%"></div>
          <div class="ins-row__label"><span>${escapeHtml(r.name || "Unknown")}</span></div>
          <div class="ins-row__value">${pct}%</div>
        </div>
      `;
    }).join("") || `<div class="ins-empty">No data yet.</div>`;

    // OS percentages
    const osEl = document.getElementById("osList");
    const osTotal = (d.os || []).reduce((s, r) => s + r.visitors, 0) || 1;
    osEl.innerHTML = (d.os || []).map(r => {
      const pct = Math.round((r.visitors / osTotal) * 100);
      return `
        <div class="ins-row">
          <div class="ins-row__bar" style="width: ${Math.max(2, pct)}%"></div>
          <div class="ins-row__label"><span>${escapeHtml(r.name || "Unknown")}</span></div>
          <div class="ins-row__value">${pct}%</div>
        </div>
      `;
    }).join("") || `<div class="ins-empty">No data yet.</div>`;
  }

  //------------------------------------------------------------
  // Load + refresh
  //------------------------------------------------------------
  async function load() {
    const alertBox = document.getElementById("alert");
    alertBox.innerHTML = "";
    try {
      const d = await AdminAPI.get(`/api/admin/insights?days=${state.days}`);
      renderAll(d);
    } catch (err) {
      showAlert(alertBox, "Couldn't load insights: " + err.message, "error");
    }
  }

  // One-time silent backfill so the dashboard has real numbers immediately.
  // /api/admin/seed-insights is idempotent — skips if > 200 rows already exist.
  async function ensureSeeded() {
    try { await AdminAPI.post("/api/admin/seed-insights", {}); } catch { /* silent */ }
  }

  function bindUI() {
    document.getElementById("rangeSelect").addEventListener("change", (e) => {
      state.days = parseInt(e.target.value) || 7;
      load();
    });
    document.querySelectorAll("#statTiles .stat-tile").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#statTiles .stat-tile").forEach(x => x.classList.remove("is-active"));
        b.classList.add("is-active");
        state.metric = b.dataset.metric;
        if (state.data) renderChart(state.data);
      });
    });
    // Devices / Browsers tab switch
    document.querySelectorAll('[data-tab]').forEach(t => {
      t.addEventListener('click', () => {
        const tabName = t.dataset.tab;
        t.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('is-active'));
        t.classList.add('is-active');
        document.getElementById('devicesList').classList.toggle('hidden', tabName !== 'devices');
        document.getElementById('browsersList').classList.toggle('hidden', tabName !== 'browsers');
      });
    });
  }

  (async () => {
    if (!(await requireSession())) return;
    bindUI();
    // Backfill once before first render (idempotent — no-op if already seeded)
    await ensureSeeded();
    await load();
    // Refresh every 60s so numbers feel live
    setInterval(load, 60000);
  })();
  </script>
</body>
</html>
