<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Say More Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin">
    <aside class="admin__sidebar" id="adminSidebar">
      <div class="admin__brand">
        <img src="/logo.jpg" alt="" />
        <strong>Say More Admin</strong>
      </div>
      <nav class="admin__nav">
        <a href="/admin/index.html">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
        </a>
        <a href="/admin/leads.html">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Leads
        </a>
        <a href="/admin/blog.html">
          <svg class="admin__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Blog
        </a>
      </nav>
      <div class="admin__sidebar-foot">
        <a href="/" target="_blank" rel="noopener">View website ↗</a>
        <button id="adminLogoutBtn" type="button">Sign out</button>
      </div>
    </aside>
    <button class="admin__menu-toggle" id="adminMenuToggle" aria-label="Toggle menu">☰ Menu</button>

    <main class="admin__main">
      <div class="admin__header">
        <div>
          <h1 class="admin__title">Blog posts <small>Write, edit, and publish notes.</small></h1>
        </div>
        <div class="btn__row">
          <a href="/blog.html" class="btn btn--ghost" target="_blank" rel="noopener">View public blog ↗</a>
          <a href="/admin/blog-edit.html" class="btn">+ New post</a>
        </div>
      </div>

      <div id="alert"></div>

      <div class="stat-grid" style="margin-bottom: 20px;">
        <div class="stat">
          <div class="stat__label">Total posts</div>
          <div class="stat__value" id="statPostsTotal">—</div>
          <div class="stat__hint">Published + drafts</div>
        </div>
        <div class="stat">
          <div class="stat__label">Published</div>
          <div class="stat__value" id="statPostsPublished">—</div>
          <div class="stat__hint">Live on the blog</div>
        </div>
        <div class="stat">
          <div class="stat__label">Drafts</div>
          <div class="stat__value" id="statPostsDrafts">—</div>
          <div class="stat__hint">Not published yet</div>
        </div>
      </div>

      <div id="postsGrid" class="admin-post-grid">
        <div class="loading" style="grid-column: 1/-1;">Loading posts…</div>
      </div>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    (async () => {
      if (!(await requireSession())) return;
      const alertBox = document.getElementById("alert");
      const grid = document.getElementById("postsGrid");

      async function load() {
        try {
          const data = await AdminAPI.get("/api/admin/posts");
          document.getElementById("statPostsTotal").textContent = data.posts.length;
          document.getElementById("statPostsPublished").textContent = data.posts.filter(p => p.published).length;
          document.getElementById("statPostsDrafts").textContent = data.posts.filter(p => !p.published).length;

          if (!data.posts.length) {
            grid.innerHTML = `<div class="empty" style="grid-column: 1/-1;">
              <h3>No posts yet.</h3>
              <p>Write your first note.</p>
              <a href="/admin/blog-edit.html" class="btn" style="margin-top: 12px;">+ New post</a>
            </div>`;
            return;
          }

          grid.innerHTML = data.posts.map(p => {
            const summary = p.excerpt || p.meta_description || "";
            const dateLabel = p.published_at
              ? fmtDate(p.published_at)
              : `Draft · updated ${fmtRelative(p.updated_at)}`;
            return `
              <article class="admin-post-card${p.published ? "" : " admin-post-card--draft"}">
                <a class="admin-post-card__link" href="/admin/blog-edit.html?id=${p.id}" aria-label="Edit ${escapeHtml(p.title)}">
                  <div class="admin-post-card__cover">
                    ${p.cover_image
                      ? `<img src="${escapeHtml(p.cover_image)}" alt="${escapeHtml(p.title)}" loading="lazy" />`
                      : `<div class="admin-post-card__cover-empty">
                          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                          <span>No cover</span>
                        </div>`}
                    <span class="admin-post-card__status ${p.published ? "is-published" : "is-draft"}">${p.published ? "Published" : "Draft"}</span>
                  </div>
                  <div class="admin-post-card__body">
                    <div class="admin-post-card__meta">${escapeHtml(dateLabel)}</div>
                    <h3 class="admin-post-card__title">${escapeHtml(p.title)}</h3>
                    ${summary ? `<p class="admin-post-card__excerpt">${escapeHtml(summary)}</p>` : ""}
                    <span class="admin-post-card__more">Edit post <span aria-hidden="true">→</span></span>
                  </div>
                </a>
                <div class="admin-post-card__actions">
                  <div class="admin-post-card__actions-left">
                    <code>/blog/${escapeHtml(p.slug)}</code>
                  </div>
                  <div class="admin-post-card__actions-right">
                    ${p.published ? `<a href="/blog/${escapeHtml(p.slug)}" target="_blank" rel="noopener" title="Open the live post in a new tab">View ↗</a>` : `<a href="/blog/${escapeHtml(p.slug)}?preview=1" target="_blank" rel="noopener" title="Preview the draft in a new tab">Preview ↗</a>`}
                    <button type="button" class="delete-post" data-id="${p.id}" data-title="${escapeHtml(p.title)}" title="Delete this post">Delete</button>
                  </div>
                </div>
              </article>
            `;
          }).join("");

          grid.querySelectorAll(".delete-post").forEach(b => {
            b.addEventListener("click", async (e) => {
              e.preventDefault();
              const id = b.dataset.id;
              const title = b.dataset.title;
              if (!confirm(`Delete "${title}"? This can't be undone.`)) return;
              try {
                await AdminAPI.del(`/api/admin/posts?id=${id}`);
                await load();
              } catch (err) {
                showAlert(alertBox, err.message, "error");
              }
            });
          });
        } catch (err) {
          showAlert(alertBox, "Couldn't load posts: " + err.message, "error");
          grid.innerHTML = `<div class='empty' style="grid-column: 1/-1;"><h3>Unable to load posts</h3></div>`;
        }
      }
      load();
    })();
  </script>
</body>
</html>
